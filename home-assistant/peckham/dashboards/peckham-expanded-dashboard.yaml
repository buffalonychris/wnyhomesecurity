# T-HA-DASH-PECKHAM-002 REV03
# INTERNAL EXPANDED/DESKTOP QA COMPANION — NOT A SECOND CUSTOMER PRODUCT.
# NOT REGISTERED, ASSIGNED, DEPLOYED, OR RUNTIME-VALIDATED.
# Semantic state, navigation, bindings, and limitations match the primary dashboard.
# Installed frontend resources used: Mushroom and card-mod. No dependency is added.

title: Peckham Expanded Dashboard QA Companion
views:
  - title: Home
    path: home
    icon: mdi:home-outline
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: BK LEWIS · PECKHAM
            secondary: >-
              {% set contacts = [
                states('binary_sensor.sensor13'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2'),
                states('binary_sensor.sensor03'), states('binary_sensor.sensor04'),
                states('binary_sensor.sensor05'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3'),
                states('binary_sensor.sensor7'), states('binary_sensor.sensor08'),
                states('binary_sensor.sensor09'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4'),
                states('binary_sensor.sensor11'), states('binary_sensor.sensor12'),
                states('binary_sensor.sensor14'), states('binary_sensor.sensor15'),
                states('binary_sensor.sensor16')
              ] %}
              {% set closed = contacts | select('eq', 'off') | list | count %}
              {% set open = contacts | select('eq', 'on') | list | count %}
              {% set deadbolt = states('lock.door_lock_deadbolt_main_door') %}
              {% set lever = states('lock.door_lock_lower_lever_handle_main') %}
              {% if open > 0 or deadbolt == 'unlocked' or lever == 'unlocked' %}
                Building Status · Attention
              {% elif closed + open < 16
                    or deadbolt not in ['locked', 'unlocked']
                    or lever not in ['locked', 'unlocked'] %}
                Building Status · Unavailable
              {% else %}
                Building Status · Normal
              {% endif %}
            icon: mdi:shield-home-outline
            icon_color: >-
              {% set contacts = [
                states('binary_sensor.sensor13'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2'),
                states('binary_sensor.sensor03'), states('binary_sensor.sensor04'),
                states('binary_sensor.sensor05'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3'),
                states('binary_sensor.sensor7'), states('binary_sensor.sensor08'),
                states('binary_sensor.sensor09'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4'),
                states('binary_sensor.sensor11'), states('binary_sensor.sensor12'),
                states('binary_sensor.sensor14'), states('binary_sensor.sensor15'),
                states('binary_sensor.sensor16')
              ] %}
              {% set closed = contacts | select('eq', 'off') | list | count %}
              {% set open = contacts | select('eq', 'on') | list | count %}
              {% set deadbolt = states('lock.door_lock_deadbolt_main_door') %}
              {% set lever = states('lock.door_lock_lower_lever_handle_main') %}
              {% if open > 0 or deadbolt == 'unlocked' or lever == 'unlocked' %}#F5A524
              {% elif closed + open < 16
                    or deadbolt not in ['locked', 'unlocked']
                    or lever not in ['locked', 'unlocked'] %}#94A3B8
              {% else %}#22C55E{% endif %}
            multiline_secondary: true
            tap_action: {action: none}
            hold_action: {action: none}
            double_tap_action: {action: none}
          - type: markdown
            content: |
              Status is scoped to the 16 opening contacts and two Main Entrance
              locks. Planned cameras are excluded from all health conclusions.

      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Main Entrance
            secondary: >-
              {% set door = states('binary_sensor.sensor13') %}
              {% set deadbolt = states('lock.door_lock_deadbolt_main_door') %}
              {% set lever = states('lock.door_lock_lower_lever_handle_main') %}
              Door: {% if door == 'off' %}Closed{% elif door == 'on' %}Open{% else %}Unavailable{% endif %}
              · Deadbolt: {% if deadbolt == 'locked' %}Locked{% elif deadbolt == 'unlocked' %}Unlocked{% elif deadbolt == 'unavailable' %}Unavailable{% else %}Unknown / unable to confirm{% endif %}
              · Lever: {% if lever == 'locked' %}Locked{% elif lever == 'unlocked' %}Unlocked{% elif lever == 'unavailable' %}Unavailable{% else %}Unknown / unable to confirm{% endif %}
            icon: mdi:door
            icon_color: >-
              {% set door = states('binary_sensor.sensor13') %}
              {% set deadbolt = states('lock.door_lock_deadbolt_main_door') %}
              {% set lever = states('lock.door_lock_lower_lever_handle_main') %}
              {% if door == 'on' or deadbolt == 'unlocked' or lever == 'unlocked' %}#F5A524
              {% elif door not in ['on', 'off']
                    or deadbolt not in ['locked', 'unlocked']
                    or lever not in ['locked', 'unlocked'] %}#94A3B8
              {% else %}#22C55E{% endif %}
            multiline_secondary: true
            tap_action: {action: navigate, navigation_path: /lovelace/systems}

