# T-HA-DASH-PECKHAM-002 REV02 — PHASE A PREVIEW
# REPOSITORY PREVIEW ONLY — DO NOT DEPLOY BEFORE OPERATOR REVIEW.
# Contact entities are backup-verified. Window physical locations remain unresolved.
# Doorbell and lock regions are visual placeholders with no entity or service binding.
# The approved WNYHS gold logo location remains reserved; no asset path is invented.

title: Peckham Expanded Customer Dashboard
views:
  - title: Home
    path: home
    icon: mdi:home-outline
    type: masonry
    max_columns: 3
    cards:
      - &site_header
        type: custom:button-card
        name: PK | PECKHAM
        label: WNY Home Security · Expanded Customer Dashboard
        icon: mdi:home-city-outline
        show_label: true
        tap_action: {action: none}
        styles:
          card:
            - min-height: 118px
            - padding: 22px
            - border-radius: var(--ha-card-border-radius)
            - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
            - border-left: 7px solid var(--wnyhs-gold, var(--primary-color))
            - background: var(--wnyhs-card-background, var(--ha-card-background))
            - box-shadow: var(--ha-card-box-shadow)
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 66px 1fr
          icon:
            - width: 50px
            - color: var(--wnyhs-gold, var(--primary-color))
          name:
            - justify-self: start
            - font-size: 28px
            - font-weight: 800
            - color: var(--primary-text-color)
          label:
            - justify-self: start
            - font-size: 16px
            - color: var(--secondary-text-color)

      - &building_status
        type: custom:mushroom-template-card
        primary: Building Status
        secondary: >-
          {% set contacts = [
            'binary_sensor.sensor13',
            'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003',
            'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2',
            'binary_sensor.sensor03',
            'binary_sensor.sensor04',
            'binary_sensor.sensor05',
            'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3',
            'binary_sensor.sensor7',
            'binary_sensor.sensor08',
            'binary_sensor.sensor09',
            'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4',
            'binary_sensor.sensor11',
            'binary_sensor.sensor12',
            'binary_sensor.sensor14',
            'binary_sensor.sensor15',
            'binary_sensor.sensor16'
          ] %}
          {% set ns = namespace(open=0, missing=0) %}
          {% for id in contacts %}
            {% if states(id) == 'on' %}{% set ns.open = ns.open + 1 %}
            {% elif states(id) in ['unknown', 'unavailable'] %}{% set ns.missing = ns.missing + 1 %}{% endif %}
          {% endfor %}
          {% if ns.missing > 0 %}Contact coverage: {{ 16 - ns.missing }} of 16 reporting · Information
          {% elif ns.open > 0 %}{{ ns.open }} contact{{ '' if ns.open == 1 else 's' }} open · Attention
          {% else %}All 16 contact sensors closed · Normal{% endif %}
        icon: mdi:shield-home-outline
        icon_color: >-
          {% set contacts = [
            'binary_sensor.sensor13',
            'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003',
            'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2',
            'binary_sensor.sensor03',
            'binary_sensor.sensor04',
            'binary_sensor.sensor05',
            'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3',
            'binary_sensor.sensor7',
            'binary_sensor.sensor08',
            'binary_sensor.sensor09',
            'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4',
            'binary_sensor.sensor11',
            'binary_sensor.sensor12',
            'binary_sensor.sensor14',
            'binary_sensor.sensor15',
            'binary_sensor.sensor16'
          ] %}
          {% set ns = namespace(open=0, missing=0) %}
          {% for id in contacts %}
            {% if states(id) == 'on' %}{% set ns.open = ns.open + 1 %}
            {% elif states(id) in ['unknown', 'unavailable'] %}{% set ns.missing = ns.missing + 1 %}{% endif %}
          {% endfor %}
          {% if ns.missing > 0 %}blue{% elif ns.open > 0 %}amber{% else %}green{% endif %}
        multiline_secondary: true
        tap_action: {action: none}
        card_mod:
          style: &status_tile |
            ha-card {
              min-height: 96px;
              border-radius: var(--ha-card-border-radius);
              border: var(--ha-card-border-width) solid var(--ha-card-border-color);
              background: var(--wnyhs-card-background, var(--ha-card-background));
              box-shadow: var(--ha-card-box-shadow);
            }

      - type: custom:mushroom-template-card
        entity: binary_sensor.sensor13
        primary: Main Entrance Door
        secondary: >-
          {% if is_state('binary_sensor.sensor13', 'on') %}Open · Attention
          {% elif is_state('binary_sensor.sensor13', 'off') %}Closed · Normal
          {% else %}Status needs review · Information{% endif %}
        icon: "{% if is_state('binary_sensor.sensor13', 'on') %}mdi:door-open{% else %}mdi:door-closed{% endif %}"
        icon_color: "{% if is_state('binary_sensor.sensor13', 'on') %}amber{% elif is_state('binary_sensor.sensor13', 'off') %}green{% else %}blue{% endif %}"
        tap_action: {action: more-info}
        card_mod: {style: *status_tile}

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            name: First-Floor Windows
            label: 15 window contacts · Temporary names until onsite
            icon: mdi:window-closed-variant
            show_label: true
            tap_action: {action: none}
            styles: &summary_card_styles
              card:
                - min-height: 116px
                - padding: 16px
                - border-radius: var(--ha-card-border-radius)
                - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
                - background: var(--wnyhs-card-background, var(--ha-card-background))
                - box-shadow: var(--ha-card-box-shadow)
              icon:
                - width: 40px
                - color: var(--wnyhs-gold, var(--primary-color))
              name:
                - font-weight: 800
                - color: var(--primary-text-color)
              label:
                - white-space: normal
                - color: var(--secondary-text-color)
          - type: custom:button-card
            name: Entry Integration
            label: Doorbell and two locks · Pending onsite integration
            icon: mdi:doorbell-video
            show_label: true
            tap_action: {action: none}
            styles: *summary_card_styles

      - type: custom:button-card
        name: Appearance
        label: Light · Dark · Auto presentation ready for operator review
        icon: mdi:theme-light-dark
        show_label: true
        tap_action: {action: none}
        styles: *summary_card_styles

      - &footer
        type: markdown
        content: |
          ---
          **WNY Home Security** · wnyhomesecurity.com · 716-201-0364
        card_mod:
          style: |
            ha-card {
              text-align: center;
              color: var(--secondary-text-color);
              background: transparent;
              box-shadow: none;
            }

  - title: Main Entrance
    path: main-entrance
    icon: mdi:door
    type: masonry
    max_columns: 2
    cards:
      - *site_header
      - *building_status
      - type: custom:mushroom-template-card
        entity: binary_sensor.sensor13
        primary: Main Entrance Door
        secondary: >-
          {% if is_state('binary_sensor.sensor13', 'on') %}Open · Attention
          {% elif is_state('binary_sensor.sensor13', 'off') %}Closed · Normal
          {% else %}Status needs review · Information{% endif %}
        icon: "{% if is_state('binary_sensor.sensor13', 'on') %}mdi:door-open{% else %}mdi:door-closed{% endif %}"
        icon_color: "{% if is_state('binary_sensor.sensor13', 'on') %}amber{% elif is_state('binary_sensor.sensor13', 'off') %}green{% else %}blue{% endif %}"
        tap_action: {action: more-info}
        card_mod: {style: *status_tile}

      - type: custom:button-card
        name: Main Entrance Doorbell
        label: Planned Reolink position · Pending onsite integration
        icon: mdi:doorbell-video
        show_label: true
        tap_action: {action: none}
        styles:
          card:
            - min-height: 280px
            - padding: 28px
            - border-radius: var(--ha-card-border-radius)
            - border: 2px dashed var(--ha-card-border-color)
            - background: var(--wnyhs-card-background, var(--ha-card-background))
            - box-shadow: var(--ha-card-box-shadow)
          icon:
            - width: 92px
            - color: var(--wnyhs-gold, var(--primary-color))
          name:
            - font-size: 24px
            - font-weight: 800
            - color: var(--primary-text-color)
          label:
            - white-space: normal
            - font-size: 16px
            - color: var(--secondary-text-color)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            name: Lever Lock
            label: Kwikset SmartCode 912 · Pending onsite integration
            icon: mdi:door-closed-lock
            show_label: true
            tap_action: {action: none}
            styles: &pending_card_styles
              card:
                - min-height: 148px
                - padding: 18px
                - border-radius: var(--ha-card-border-radius)
                - border: 2px dashed var(--ha-card-border-color)
                - background: var(--wnyhs-card-background, var(--ha-card-background))
                - box-shadow: var(--ha-card-box-shadow)
              icon:
                - width: 46px
                - color: var(--info-color)
              name:
                - font-weight: 800
                - color: var(--primary-text-color)
              label:
                - white-space: normal
                - color: var(--secondary-text-color)
          - type: custom:button-card
            name: Deadbolt
            label: Kwikset Home Connect 620 · Pending onsite integration
            icon: mdi:lock-outline
            show_label: true
            tap_action: {action: none}
            styles: *pending_card_styles

      - type: custom:button-card
        name: Overall Main Entrance
        label: Full lock confirmation requires both verified lock states · Information
        icon: mdi:shield-key-outline
        show_label: true
        tap_action: {action: none}
        styles: *summary_card_styles
      - *footer

  - title: Windows
    path: windows
    icon: mdi:window-closed-variant
    type: masonry
    max_columns: 3
    cards:
      - *site_header
      - *building_status
      - type: markdown
        content: |
          ## First-Floor Windows
          All 15 contacts are included in this preview. Temporary labels remain until onsite trigger testing establishes each physical location.
        card_mod:
          style: |
            ha-card {
              border-radius: var(--ha-card-border-radius);
              border: var(--ha-card-border-width) solid var(--ha-card-border-color);
              background: var(--wnyhs-card-background, var(--ha-card-background));
            }
      - type: custom:auto-entities
        card:
          type: grid
          columns: 3
          square: false
        card_param: cards
        filter:
          include:
            - entity: binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003
              options: {type: custom:mushroom-entity-card, name: Window Sensor 01, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2
              options: {type: custom:mushroom-entity-card, name: Window Sensor 02, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor03
              options: {type: custom:mushroom-entity-card, name: Window Sensor 03, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor04
              options: {type: custom:mushroom-entity-card, name: Window Sensor 04, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor05
              options: {type: custom:mushroom-entity-card, name: Window Sensor 05, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3
              options: {type: custom:mushroom-entity-card, name: Window Sensor 06, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor7
              options: {type: custom:mushroom-entity-card, name: Window Sensor 07, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor08
              options: {type: custom:mushroom-entity-card, name: Window Sensor 08, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor09
              options: {type: custom:mushroom-entity-card, name: Window Sensor 09, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4
              options: {type: custom:mushroom-entity-card, name: Window Sensor 10, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor11
              options: {type: custom:mushroom-entity-card, name: Window Sensor 11, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor12
              options: {type: custom:mushroom-entity-card, name: Window Sensor 12, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor14
              options: {type: custom:mushroom-entity-card, name: Window Sensor 13, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor15
              options: {type: custom:mushroom-entity-card, name: Window Sensor 14, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
            - entity: binary_sensor.sensor16
              options: {type: custom:mushroom-entity-card, name: Window Sensor 15, icon: mdi:window-closed-variant, tap_action: {action: more-info}}
      - *footer

  - title: Appearance
    path: appearance
    icon: mdi:theme-light-dark
    type: masonry
    max_columns: 3
    cards:
      - *site_header
      - *building_status
      - type: markdown
        content: |
          ## Appearance
          Light, Dark, and Auto preserve identical navigation, status meaning, and card order. Final appearance selection will be confirmed during onsite setup.
        card_mod:
          style: |
            ha-card {
              border-radius: var(--ha-card-border-radius);
              border: var(--ha-card-border-width) solid var(--ha-card-border-color);
              background: var(--wnyhs-card-background, var(--ha-card-background));
            }
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:button-card
            name: Light
            label: Bright daily view
            icon: mdi:white-balance-sunny
            show_label: true
            tap_action: {action: none}
            styles: *pending_card_styles
          - type: custom:button-card
            name: Dark
            label: Low-light daily view
            icon: mdi:weather-night
            show_label: true
            tap_action: {action: none}
            styles: *pending_card_styles
          - type: custom:button-card
            name: Auto
            label: Follow device preference
            icon: mdi:theme-light-dark
            show_label: true
            tap_action: {action: none}
            styles: *pending_card_styles
      - *footer

  - title: More
    path: more
    icon: mdi:dots-horizontal-circle-outline
    type: masonry
    max_columns: 2
    cards:
      - *site_header
      - *building_status
      - type: custom:mushroom-template-card
        primary: Setup Progress
        secondary: Window contacts are ready for review. Final window names, doorbell, and locks will be completed onsite.
        icon: mdi:clipboard-check-outline
        icon_color: blue
        multiline_secondary: true
        tap_action: {action: none}
        card_mod: {style: *status_tile}
      - type: markdown
        content: |
          ## Status words
          - **Normal** — no current contact action is indicated.
          - **Information** — helpful context or pending integration.
          - **Attention** — a contact is open or needs review.
          - **Critical** — prompt action is required when a later verified rule supports it.
        card_mod:
          style: |
            ha-card {
              border-radius: var(--ha-card-border-radius);
              border: var(--ha-card-border-width) solid var(--ha-card-border-color);
              background: var(--wnyhs-card-background, var(--ha-card-background));
            }
      - *footer
