# T-HA-DASH-PECKHAM-003 REV01
# Peckham customer visual production pass. Repository source only; not deployed.
# Proven runtime bindings and state semantics are preserved from REV03.
# Installed components used: native Lovelace Sections, Mushroom, button-card, card-mod.

title: WNY Home Security Customer Control Center

button_card_templates:
  peckham_panel:
    show_state: false
    show_label: true
    grid_options: &full_width_card
      columns: 12
      rows: auto
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - background: "var(--peckham-surface-tile, #111D2E)"
        - border: "1px solid var(--peckham-border, #314056)"
        - border-radius: 16px
        - box-shadow: "0 10px 28px rgb(0 0 0 / 28%)"
        - padding: 20px
        - color: "var(--peckham-text-primary, #F8FAFC)"
        - overflow: hidden
      name:
        - color: "var(--peckham-text-primary, #F8FAFC)"
        - font-size: 18px
        - font-weight: 700
        - line-height: 24px
      label:
        - color: "var(--peckham-text-muted, #A8B3C2)"
        - font-size: 16px
        - line-height: 24px
      icon:
        - color: "var(--peckham-gold, #D4AF37)"

  peckham_heading:
    template: peckham_panel
    name: "[[[ return variables.heading; ]]]"
    label: "[[[ return variables.description; ]]]"
    icon: "[[[ return variables.icon; ]]]"
    styles:
      card:
        - min-height: 104px
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 52px minmax(0, 1fr)
        - grid-template-rows: min-content min-content
        - column-gap: 14px
      icon:
        - width: 26px
      img_cell:
        - width: 48px
        - height: 48px
        - border-radius: 50%
        - background: "var(--peckham-icon-background, #050A12)"
        - align-self: center
      name:
        - justify-self: start
        - color: "var(--peckham-gold, #D4AF37)"
      label:
        - justify-self: start
        - text-align: left
        - white-space: normal

  peckham_contact:
    template: peckham_panel
    name: "[[[ return variables.title; ]]]"
    label: |
      [[[
        if (!entity || !['on', 'off'].includes(entity.state)) return 'UNAVAILABLE';
        return entity.state === 'off' ? 'CLOSED' : 'OPEN';
      ]]]
    icon: |
      [[[
        if (variables.door) return entity && entity.state === 'on' ? 'mdi:door-open' : 'mdi:door-closed';
        return 'mdi:checkbox-blank-circle-outline';
      ]]]
    styles:
      card:
        - min-height: 96px
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 48px minmax(0, 1fr)
        - grid-template-rows: min-content min-content
        - column-gap: 14px
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 50%
        - background: "var(--peckham-icon-background, #050A12)"
      icon:
        - width: 23px
      name:
        - justify-self: start
        - text-align: left
      label:
        - justify-self: start
        - font-weight: 700
        - letter-spacing: 0.04em
        - color: |
            [[[
              if (!entity || !['on', 'off'].includes(entity.state)) return 'var(--status-unavailable, #94A3B8)';
              return entity.state === 'off' ? 'var(--status-normal, #22C55E)' : 'var(--status-attention, #F5A524)';
            ]]]

  peckham_lock:
    template: peckham_panel
    name: "[[[ return variables.title; ]]]"
    label: |
      [[[
        if (!entity) return 'UNAVAILABLE';
        if (entity.state === 'locked') return 'LOCKED';
        if (entity.state === 'unlocked') return 'UNLOCKED';
        return 'UNAVAILABLE';
      ]]]
    icon: |
      [[[
        return entity && entity.state === 'unlocked' ? 'mdi:lock-open-variant-outline' : 'mdi:lock-outline';
      ]]]
    styles:
      card:
        - min-height: 96px
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 48px minmax(0, 1fr)
        - grid-template-rows: min-content min-content
        - column-gap: 14px
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 50%
        - background: "var(--peckham-icon-background, #050A12)"
      icon:
        - width: 23px
      name:
        - justify-self: start
        - text-align: left
      label:
        - justify-self: start
        - font-weight: 700
        - letter-spacing: 0.04em
        - color: |
            [[[
              if (!entity || !['locked', 'unlocked'].includes(entity.state)) return 'var(--status-unavailable, #94A3B8)';
              return entity.state === 'locked' ? 'var(--status-normal, #22C55E)' : 'var(--status-attention, #F5A524)';
            ]]]

  peckham_camera_placeholder:
    template: peckham_panel
    name: "[[[ return variables.title; ]]]"
    label: SETUP PENDING
    icon: "[[[ return variables.icon; ]]]"
    styles:
      card:
        - aspect-ratio: 16 / 9
        - min-height: 220px
        - justify-content: center
        - background: "var(--peckham-surface-recessed, #091321)"
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 72px min-content min-content
        - row-gap: 10px
      img_cell:
        - width: 64px
        - height: 64px
        - justify-self: center
        - border-radius: 50%
        - background: "var(--peckham-icon-background, #050A12)"
      icon:
        - width: 32px
      name:
        - justify-self: center
        - text-align: center
      label:
        - justify-self: center
        - color: "var(--peckham-text-muted, #A8B3C2)"
        - font-weight: 700
        - letter-spacing: 0.08em

  peckham_action:
    template: peckham_panel
    styles:
      card:
        - min-height: 112px
        - border: "2px solid var(--peckham-action, #0A84FF)"
        - cursor: pointer
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 52px minmax(0, 1fr)
        - grid-template-rows: min-content min-content
        - column-gap: 14px
      img_cell:
        - width: 48px
        - height: 48px
        - border-radius: 50%
        - background: "var(--peckham-icon-background, #050A12)"
      icon:
        - width: 25px
        - color: "var(--peckham-action, #0A84FF)"
      name:
        - justify-self: start
      label:
        - justify-self: start
        - text-align: left
        - white-space: normal

views:
  - title: Home
    path: home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-template-card
            grid_options:
              columns: 12
              rows: auto
            primary: WNY HOME SECURITY
            secondary: >-
              BK LEWIS · PECKHAM
              · {{ now().strftime('%A, %B %d · %I:%M %p') }}
            icon: mdi:shield-home-outline
            icon_color: "var(--peckham-gold, #D4AF37)"
            multiline_secondary: true
            tap_action: {action: none}
            hold_action: {action: none}
            double_tap_action: {action: none}
            card_mod:
              style: |
                ha-card {
                  --card-primary-color: var(--peckham-gold, #D4AF37);
                  --card-secondary-color: var(--peckham-text-muted, #A8B3C2);
                  --icon-color: var(--peckham-gold, #D4AF37);
                  background: var(--peckham-surface-shell, #0D1726);
                  border: 1px solid var(--peckham-border, #314056);
                  border-radius: 16px;
                  box-shadow: 0 10px 28px rgb(0 0 0 / 28%);
                  min-height: 118px;
                  padding: 14px 18px;
                }

      - type: grid
        column_span: 2
        cards:
          - type: custom:button-card
            template: peckham_panel
            name: PROPERTY STATUS
            label: |
              [[[
                const contacts = [
                  'binary_sensor.sensor13',
                  'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003',
                  'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2',
                  'binary_sensor.sensor03',
                  'binary_sensor.sensor04',
                  'binary_sensor.sensor05',
                  'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3',
                  'binary_sensor.sensor7',
                  'binary_sensor.sensor08',
                  'binary_sensor.sensor09',
                  'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4',
                  'binary_sensor.sensor11',
                  'binary_sensor.sensor12',
                  'binary_sensor.sensor14',
                  'binary_sensor.sensor15',
                  'binary_sensor.sensor16'
                ].map(id => states[id]?.state);
                const open = contacts.filter(state => state === 'on').length;
                const closed = contacts.filter(state => state === 'off').length;
                const deadbolt = states['lock.door_lock_deadbolt_main_door']?.state;
                const lever = states['lock.door_lock_lower_lever_handle_main']?.state;
                if (open > 0 || deadbolt === 'unlocked' || lever === 'unlocked') return 'ATTENTION';
                if (closed + open < 16 || !['locked', 'unlocked'].includes(deadbolt) || !['locked', 'unlocked'].includes(lever)) return 'UNAVAILABLE';
                return 'NORMAL';
              ]]]
            icon: mdi:shield-home-outline
            custom_fields:
              message: |
                [[[
                  const contacts = [
                    'binary_sensor.sensor13',
                    'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003',
                    'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2',
                    'binary_sensor.sensor03',
                    'binary_sensor.sensor04',
                    'binary_sensor.sensor05',
                    'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3',
                    'binary_sensor.sensor7',
                    'binary_sensor.sensor08',
                    'binary_sensor.sensor09',
                    'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4',
                    'binary_sensor.sensor11',
                    'binary_sensor.sensor12',
                    'binary_sensor.sensor14',
                    'binary_sensor.sensor15',
                    'binary_sensor.sensor16'
                  ].map(id => states[id]?.state);
                  const open = contacts.filter(state => state === 'on').length;
                  const closed = contacts.filter(state => state === 'off').length;
                  const deadbolt = states['lock.door_lock_deadbolt_main_door']?.state;
                  const lever = states['lock.door_lock_lower_lever_handle_main']?.state;
                  if (open > 0 || deadbolt === 'unlocked' || lever === 'unlocked') return 'An opening or entrance lock needs your attention.';
                  if (closed + open < 16 || !['locked', 'unlocked'].includes(deadbolt) || !['locked', 'unlocked'].includes(lever)) return 'Some current conditions cannot be confirmed.';
                  return 'Connected openings and entrance locks report normal conditions.';
                ]]]
            styles:
              card:
                - min-height: 248px
                - padding: 28px
              grid:
                - grid-template-areas: '"i n" "i l" "message message"'
                - grid-template-columns: 72px minmax(0, 1fr)
                - grid-template-rows: min-content min-content 1fr
                - column-gap: 18px
                - row-gap: 10px
              img_cell:
                - width: 64px
                - height: 64px
                - border-radius: 50%
                - background: "var(--peckham-icon-background, #050A12)"
              icon:
                - width: 34px
              name:
                - justify-self: start
                - color: "var(--peckham-text-muted, #A8B3C2)"
                - font-size: 14px
                - letter-spacing: 0.12em
              label:
                - justify-self: start
                - font-size: 32px
                - line-height: 38px
                - font-weight: 700
                - color: |
                    [[[
                      const contacts = [
                        'binary_sensor.sensor13','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2','binary_sensor.sensor03','binary_sensor.sensor04','binary_sensor.sensor05','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3','binary_sensor.sensor7','binary_sensor.sensor08','binary_sensor.sensor09','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4','binary_sensor.sensor11','binary_sensor.sensor12','binary_sensor.sensor14','binary_sensor.sensor15','binary_sensor.sensor16'
                      ].map(id => states[id]?.state);
                      const open = contacts.filter(state => state === 'on').length;
                      const closed = contacts.filter(state => state === 'off').length;
                      const deadbolt = states['lock.door_lock_deadbolt_main_door']?.state;
                      const lever = states['lock.door_lock_lower_lever_handle_main']?.state;
                      if (open > 0 || deadbolt === 'unlocked' || lever === 'unlocked') return 'var(--status-attention, #F5A524)';
                      if (closed + open < 16 || !['locked', 'unlocked'].includes(deadbolt) || !['locked', 'unlocked'].includes(lever)) return 'var(--status-unavailable, #94A3B8)';
                      return 'var(--status-normal, #22C55E)';
                    ]]]
              custom_fields:
                message:
                  - align-self: end
                  - justify-self: stretch
                  - margin-top: 14px
                  - padding-top: 16px
                  - border-top: "1px solid var(--peckham-border, #314056)"
                  - color: "var(--peckham-text-muted, #A8B3C2)"
                  - font-size: 16px
                  - line-height: 24px
                  - text-align: left

      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Peckham Weather
            forecast_type: daily
            show_current: true
            show_forecast: true
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: var(--peckham-text-primary, #F8FAFC);
                  --secondary-text-color: var(--peckham-text-muted, #A8B3C2);
                  background: var(--peckham-surface-tile, #111D2E);
                  border: 1px solid var(--peckham-border, #314056);
                  border-radius: 16px;
                  box-shadow: 0 10px 28px rgb(0 0 0 / 28%);
                  min-height: 248px;
                }

      - type: grid
        column_span: 2
        cards:
          - type: custom:button-card
            template: peckham_panel
            name: MAIN ENTRANCE
            icon: mdi:door
            show_label: false
            custom_fields:
              door: |
                [[[
                  const state = states['binary_sensor.sensor13']?.state;
                  const value = state === 'off' ? 'CLOSED' : state === 'on' ? 'OPEN' : 'UNAVAILABLE';
                  const color = state === 'off' ? 'var(--status-normal, #22C55E)' : state === 'on' ? 'var(--status-attention, #F5A524)' : 'var(--status-unavailable, #94A3B8)';
                  return `<span>Door</span><strong style="color:${color}">${value}</strong>`;
                ]]]
              deadbolt: |
                [[[
                  const state = states['lock.door_lock_deadbolt_main_door']?.state;
                  const value = state === 'locked' ? 'LOCKED' : state === 'unlocked' ? 'UNLOCKED' : 'UNAVAILABLE';
                  const color = state === 'locked' ? 'var(--status-normal, #22C55E)' : state === 'unlocked' ? 'var(--status-attention, #F5A524)' : 'var(--status-unavailable, #94A3B8)';
                  return `<span>Deadbolt</span><strong style="color:${color}">${value}</strong>`;
                ]]]
              lever: |
                [[[
                  const state = states['lock.door_lock_lower_lever_handle_main']?.state;
                  const value = state === 'locked' ? 'LOCKED' : state === 'unlocked' ? 'UNLOCKED' : 'UNAVAILABLE';
                  const color = state === 'locked' ? 'var(--status-normal, #22C55E)' : state === 'unlocked' ? 'var(--status-attention, #F5A524)' : 'var(--status-unavailable, #94A3B8)';
                  return `<span>Lever Lock</span><strong style="color:${color}">${value}</strong>`;
                ]]]
              overall: |
                [[[
                  const door = states['binary_sensor.sensor13']?.state;
                  const deadbolt = states['lock.door_lock_deadbolt_main_door']?.state;
                  const lever = states['lock.door_lock_lower_lever_handle_main']?.state;
                  let value = 'NORMAL';
                  let color = 'var(--status-normal, #22C55E)';
                  if (door === 'on' || deadbolt === 'unlocked' || lever === 'unlocked') {
                    value = 'ATTENTION'; color = 'var(--status-attention, #F5A524)';
                  } else if (!['on', 'off'].includes(door) || !['locked', 'unlocked'].includes(deadbolt) || !['locked', 'unlocked'].includes(lever)) {
                    value = 'UNAVAILABLE'; color = 'var(--status-unavailable, #94A3B8)';
                  }
                  return `<span>Overall</span><strong style="color:${color}">${value}</strong>`;
                ]]]
            styles:
              card:
                - min-height: 286px
              grid:
                - grid-template-areas: '"i n" "door door" "deadbolt deadbolt" "lever lever" "overall overall"'
                - grid-template-columns: 48px minmax(0, 1fr)
                - grid-template-rows: min-content repeat(4, min-content)
                - column-gap: 14px
                - row-gap: 10px
              img_cell:
                - width: 44px
                - height: 44px
                - border-radius: 50%
                - background: "var(--peckham-icon-background, #050A12)"
              icon:
                - width: 24px
              name:
                - justify-self: start
                - color: "var(--peckham-gold, #D4AF37)"
                - letter-spacing: 0.08em
              custom_fields:
                door: &entrance_row
                  - display: flex
                  - justify-content: space-between
                  - align-items: center
                  - min-height: 40px
                  - padding: 8px 12px
                  - border: "1px solid var(--peckham-border, #314056)"
                  - border-radius: 8px
                  - background: "var(--peckham-surface-recessed, #091321)"
                  - color: "var(--peckham-text-muted, #A8B3C2)"
                  - font-size: 15px
                  - line-height: 20px
                deadbolt: *entrance_row
                lever: *entrance_row
                overall:
                  - display: flex
                  - justify-content: space-between
                  - align-items: center
                  - min-height: 44px
                  - margin-top: 4px
                  - padding: 8px 12px
                  - border: "1px solid var(--peckham-border, #314056)"
                  - border-radius: 8px
                  - background: "var(--peckham-surface-recessed, #091321)"
                  - color: "var(--peckham-text-primary, #F8FAFC)"
                  - font-size: 16px
                  - line-height: 20px
                  - font-weight: 700

      - type: grid
        cards:
          - type: custom:button-card
            template: peckham_panel
            name: OPENING CONTACTS
            icon: mdi:door-closed-lock
            show_label: false
            custom_fields:
              closed: |
                [[[
                  const ids = ['binary_sensor.sensor13','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2','binary_sensor.sensor03','binary_sensor.sensor04','binary_sensor.sensor05','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3','binary_sensor.sensor7','binary_sensor.sensor08','binary_sensor.sensor09','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4','binary_sensor.sensor11','binary_sensor.sensor12','binary_sensor.sensor14','binary_sensor.sensor15','binary_sensor.sensor16'];
                  return `<strong style="color:var(--status-normal, #22C55E)">${ids.filter(id => states[id]?.state === 'off').length}</strong><span>Closed</span>`;
                ]]]
              open: |
                [[[
                  const ids = ['binary_sensor.sensor13','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2','binary_sensor.sensor03','binary_sensor.sensor04','binary_sensor.sensor05','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3','binary_sensor.sensor7','binary_sensor.sensor08','binary_sensor.sensor09','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4','binary_sensor.sensor11','binary_sensor.sensor12','binary_sensor.sensor14','binary_sensor.sensor15','binary_sensor.sensor16'];
                  return `<strong style="color:var(--status-attention, #F5A524)">${ids.filter(id => states[id]?.state === 'on').length}</strong><span>Open</span>`;
                ]]]
              unavailable: |
                [[[
                  const ids = ['binary_sensor.sensor13','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2','binary_sensor.sensor03','binary_sensor.sensor04','binary_sensor.sensor05','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3','binary_sensor.sensor7','binary_sensor.sensor08','binary_sensor.sensor09','binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4','binary_sensor.sensor11','binary_sensor.sensor12','binary_sensor.sensor14','binary_sensor.sensor15','binary_sensor.sensor16'];
                  const available = ids.filter(id => ['on', 'off'].includes(states[id]?.state)).length;
                  return `<strong style="color:var(--status-unavailable, #94A3B8)">${16 - available}</strong><span>Unavailable</span>`;
                ]]]
            styles:
              card:
                - min-height: 286px
              grid:
                - grid-template-areas: '"i n n n" "closed open unavailable"'
                - grid-template-columns: 48px repeat(3, minmax(0, 1fr))
                - grid-template-rows: min-content 1fr
                - column-gap: 10px
                - row-gap: 20px
              img_cell:
                - width: 44px
                - height: 44px
                - border-radius: 50%
                - background: "var(--peckham-icon-background, #050A12)"
              icon:
                - width: 24px
              name:
                - justify-self: start
                - color: "var(--peckham-gold, #D4AF37)"
                - letter-spacing: 0.08em
              custom_fields:
                closed: &count_cell
                  - display: flex
                  - flex-direction: column
                  - justify-content: center
                  - align-items: center
                  - min-width: 0
                  - min-height: 132px
                  - padding: 10px 4px
                  - border: "1px solid var(--peckham-border, #314056)"
                  - border-radius: 12px
                  - background: "var(--peckham-surface-recessed, #091321)"
                  - color: "var(--peckham-text-muted, #A8B3C2)"
                  - font-size: 13px
                  - line-height: 20px
                open: *count_cell
                unavailable: *count_cell

  - title: Systems
    path: systems
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:button-card
            template: peckham_heading
            variables:
              heading: Systems
              description: Entrance and opening status, plus planned camera positions.
              icon: mdi:view-grid-outline

      - type: grid
        column_span: 4
        cards:
          - type: custom:button-card
            template: peckham_heading
            variables:
              heading: Main Entrance
              description: Door and lock status in one customer-ready group. Controls are not available from this dashboard yet.
              icon: mdi:shield-door

      - type: grid
        cards:
          - type: custom:button-card
            template: peckham_panel
            name: Overall Main Entrance
            label: |
              [[[
                const door = states['binary_sensor.sensor13']?.state;
                const deadbolt = states['lock.door_lock_deadbolt_main_door']?.state;
                const lever = states['lock.door_lock_lower_lever_handle_main']?.state;
                if (door === 'on' || deadbolt === 'unlocked' || lever === 'unlocked') return 'ATTENTION';
                if (!['on', 'off'].includes(door) || !['locked', 'unlocked'].includes(deadbolt) || !['locked', 'unlocked'].includes(lever)) return 'UNAVAILABLE';
                return 'NORMAL';
              ]]]
            icon: mdi:shield-home-outline
            styles:
              card:
                - min-height: 128px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 52px minmax(0, 1fr)
                - grid-template-rows: min-content min-content
                - column-gap: 14px
              img_cell:
                - width: 48px
                - height: 48px
                - border-radius: 50%
                - background: "var(--peckham-icon-background, #050A12)"
              name:
                - justify-self: start
                - text-align: left
              label:
                - justify-self: start
                - font-weight: 700
                - letter-spacing: 0.04em
                - color: |
                    [[[
                      const door = states['binary_sensor.sensor13']?.state;
                      const deadbolt = states['lock.door_lock_deadbolt_main_door']?.state;
                      const lever = states['lock.door_lock_lower_lever_handle_main']?.state;
                      if (door === 'on' || deadbolt === 'unlocked' || lever === 'unlocked') return 'var(--status-attention, #F5A524)';
                      if (!['on', 'off'].includes(door) || !['locked', 'unlocked'].includes(deadbolt) || !['locked', 'unlocked'].includes(lever)) return 'var(--status-unavailable, #94A3B8)';
                      return 'var(--status-normal, #22C55E)';
                    ]]]

