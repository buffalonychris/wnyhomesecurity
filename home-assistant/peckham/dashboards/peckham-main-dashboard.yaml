                    or lever not in ['locked', 'unlocked'] %}
                Unavailable
              {% else %}
                Normal
              {% endif %}
            icon: mdi:shield-door
            icon_color: >-
              {% set door = states('binary_sensor.sensor13') %}
              {% set deadbolt = states('lock.door_lock_deadbolt_main_door') %}
              {% set lever = states('lock.door_lock_lower_lever_handle_main') %}
              {% if door == 'on' or deadbolt == 'unlocked' or lever == 'unlocked' %}var(--status-attention)
              {% elif door not in ['on', 'off']
                    or deadbolt not in ['locked', 'unlocked']
                    or lever not in ['locked', 'unlocked'] %}var(--status-unavailable)
              {% else %}var(--status-normal){% endif %}
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
          - type: custom:mushroom-template-card
            entity: binary_sensor.sensor13
            primary: Main Entrance Door
            secondary: >-
              {% if is_state(entity, 'off') %}Closed
              {% elif is_state(entity, 'on') %}Open
              {% else %}Unavailable{% endif %}
            icon: >-
              {% if is_state(entity, 'on') %}mdi:door-open{% else %}mdi:door-closed{% endif %}
            icon_color: >-
              {% if is_state(entity, 'off') %}var(--status-normal)
              {% elif is_state(entity, 'on') %}var(--status-attention)
              {% else %}var(--status-unavailable){% endif %}
            tap_action: {action: none}
            hold_action: {action: none}
            double_tap_action: {action: none}
          - type: custom:mushroom-template-card
            entity: lock.door_lock_deadbolt_main_door
