            icon_color: >-
              {% if is_state(entity, 'locked') %}var(--status-normal)
              {% elif is_state(entity, 'unlocked') %}var(--status-attention)
              {% else %}var(--status-unavailable){% endif %}
            tap_action: {action: none}
            hold_action: {action: none}
            double_tap_action: {action: none}
          - type: custom:mushroom-template-card
