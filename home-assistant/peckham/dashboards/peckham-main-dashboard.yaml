          - type: custom:mushroom-template-card
            grid_options: &full_width_activity
              columns: 12
              rows: auto
            entity: binary_sensor.sensor13
            primary: Main Entrance Door
            secondary: >-
              {% if is_state(entity, 'off') %}Closed{% elif is_state(entity, 'on') %}Open{% else %}Unavailable{% endif %}
              · Changed {{ relative_time(states[entity].last_changed) }} ago
            multiline_secondary: true
            icon: mdi:door
            icon_color: "var(--peckham-gold, #D4AF37)"
            tap_action: {action: more-info}
            card_mod: &activity_style
              style: |
                ha-card {
                  --card-primary-color: var(--peckham-text-primary, #F8FAFC);
                  --card-secondary-color: var(--peckham-text-muted, #A8B3C2);
                  background: var(--peckham-surface-tile, #111D2E);
                  border: 1px solid var(--peckham-border, #314056);
                  border-radius: 16px;
                  box-shadow: 0 10px 28px rgb(0 0 0 / 28%);
