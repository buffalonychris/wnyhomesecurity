        icon_color: blue
        multiline_secondary: true
        tap_action: {action: none}
        card_mod: {style: *status_tile}
      - type: markdown
        content: |
          ## Status words
          - **Normal** — no current contact action is indicated.
          - **Information** — helpful context or pending integration.
          - **Attention** — a contact is open or needs review.
          - **Critical** — prompt action is required when a later verified rule supports it.
        card_mod:
          style: |
            ha-card {
              border-radius: var(--ha-card-border-radius);
              border: var(--ha-card-border-width) solid var(--ha-card-border-color);
