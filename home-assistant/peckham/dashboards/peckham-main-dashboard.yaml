              {% set open = contacts | select('eq', 'on') | list | count %}
              Closed {{ closed }} · Open {{ open }} · Unavailable {{ 16 - closed - open }}
            icon: mdi:door-closed-lock
            icon_color: >-
              {% set contacts = [
                states('binary_sensor.sensor13'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003'),
                states('binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2'),
