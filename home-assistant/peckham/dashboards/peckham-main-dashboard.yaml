  - title: Activity
    path: activity
    icon: mdi:history
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            title: BK LEWIS · PECKHAM
            content: |
              ## Latest Activity

              Customer-readable latest state changes for the four contacts that
              reported at backup time and both Main Entrance locks. This is not an
              audit log and does not prove outbound notification delivery.
          - type: custom:mushroom-template-card
            entity: binary_sensor.sensor13
            primary: Main Entrance Door
            secondary: >-
              {% if is_state(entity, 'off') %}Closed{% elif is_state(entity, 'on') %}Open{% else %}Unavailable{% endif %}
              · changed {{ relative_time(states[entity].last_changed) }} ago
            icon: mdi:door
            tap_action: {action: more-info}
          - type: custom:mushroom-template-card
            entity: binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003
