# T-HA-DASH-PECKHAM-002 REV02 — PHASE A PREVIEW
# REPOSITORY PREVIEW ONLY — DO NOT DEPLOY BEFORE OPERATOR REVIEW.
# Contact entities are backup-verified. Window physical locations remain unresolved.
# Doorbell and lock regions are visual placeholders with no entity or service binding.
# The approved WNYHS gold logo location remains reserved; no asset path is invented.

title: Peckham Customer Dashboard
views:
  - title: Home
    path: home
    icon: mdi:home-outline
    type: masonry
    cards:
      - &site_header
        type: custom:button-card
        name: PK | PECKHAM
        label: WNY Home Security · Customer Dashboard
        icon: mdi:home-city-outline
        show_label: true
        tap_action:
          action: none
        styles:
          card:
            - min-height: 104px
            - padding: 18px
            - border-radius: var(--ha-card-border-radius)
            - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
            - border-left: 6px solid var(--wnyhs-gold, var(--primary-color))
            - background: var(--wnyhs-card-background, var(--ha-card-background))
            - box-shadow: var(--ha-card-box-shadow)
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 54px 1fr
          icon:
            - width: 42px
            - color: var(--wnyhs-gold, var(--primary-color))
          name:
            - justify-self: start
            - font-size: 24px
            - font-weight: 800
            - color: var(--primary-text-color)
          label:
            - justify-self: start
            - font-size: 14px
            - color: var(--secondary-text-color)

      - &building_status
        type: custom:button-card
        name: Building Status
        label: >-
          [[[
            const ids = [
              'binary_sensor.sensor13',
              'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003',
              'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2',
              'binary_sensor.sensor03',
              'binary_sensor.sensor04',
              'binary_sensor.sensor05',
              'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3',
              'binary_sensor.sensor7',
              'binary_sensor.sensor08',
              'binary_sensor.sensor09',
              'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4',
              'binary_sensor.sensor11',
              'binary_sensor.sensor12',
              'binary_sensor.sensor14',
              'binary_sensor.sensor15',
              'binary_sensor.sensor16'
            ];
            const missing = ids.filter((id) => !states[id] || ['unknown', 'unavailable'].includes(states[id].state));
            const open = ids.filter((id) => states[id]?.state === 'on');
            if (missing.length) return `Contact coverage: ${ids.length - missing.length} of ${ids.length} reporting · Information`;
            if (open.length) return `${open.length} contact${open.length === 1 ? '' : 's'} open · Attention`;
            return 'All 16 contact sensors closed · Normal';
          ]]]
        icon: mdi:shield-home-outline
        show_label: true
        tap_action:
          action: none
        styles:
          card:
            - min-height: 112px
            - padding: 18px
            - border-radius: var(--ha-card-border-radius)
            - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
            - background: var(--wnyhs-card-background, var(--ha-card-background))
            - box-shadow: var(--ha-card-box-shadow)
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 50px 1fr
          icon:
            - width: 38px
            - color: >-
                [[[
                  const ids = [
                    'binary_sensor.sensor13',
                    'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003',
                    'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2',
                    'binary_sensor.sensor03',
                    'binary_sensor.sensor04',
                    'binary_sensor.sensor05',
                    'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3',
                    'binary_sensor.sensor7',
                    'binary_sensor.sensor08',
                    'binary_sensor.sensor09',
                    'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4',
                    'binary_sensor.sensor11',
                    'binary_sensor.sensor12',
                    'binary_sensor.sensor14',
                    'binary_sensor.sensor15',
                    'binary_sensor.sensor16'
                  ];
                  if (ids.some((id) => !states[id] || ['unknown', 'unavailable'].includes(states[id].state))) return 'var(--info-color)';
                  if (ids.some((id) => states[id]?.state === 'on')) return 'var(--wnyhs-warning-amber, var(--warning-color))';
                  return 'var(--wnyhs-success-green, var(--success-color))';
                ]]]
          name:
            - justify-self: start
            - font-size: 20px
            - font-weight: 800
            - color: var(--primary-text-color)
          label:
            - justify-self: start
            - white-space: normal
            - text-align: left
            - font-size: 14px
            - color: var(--secondary-text-color)

      - type: custom:mushroom-template-card
        entity: binary_sensor.sensor13
        primary: Main Entrance Door
        secondary: >-
          {% if is_state('binary_sensor.sensor13', 'on') %}Open · Attention
          {% elif is_state('binary_sensor.sensor13', 'off') %}Closed · Normal
          {% else %}Status needs review · Information{% endif %}
        icon: >-
          {% if is_state('binary_sensor.sensor13', 'on') %}mdi:door-open
          {% else %}mdi:door-closed{% endif %}
        icon_color: >-
          {% if is_state('binary_sensor.sensor13', 'on') %}amber
          {% elif is_state('binary_sensor.sensor13', 'off') %}green
          {% else %}blue{% endif %}
        tap_action:
          action: more-info
        card_mod:
          style: &status_tile |
            ha-card {
              min-height: 82px;
              border-radius: var(--ha-card-border-radius);
              border: var(--ha-card-border-width) solid var(--ha-card-border-color);
              background: var(--wnyhs-card-background, var(--ha-card-background));
              box-shadow: var(--ha-card-box-shadow);
            }

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            name: Windows
            label: >-
              [[[
                const ids = [
                  'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003',
                  'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_2',
                  'binary_sensor.sensor03',
                  'binary_sensor.sensor04',
                  'binary_sensor.sensor05',
                  'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_3',
                  'binary_sensor.sensor7',
                  'binary_sensor.sensor08',
                  'binary_sensor.sensor09',
                  'binary_sensor.ewelink_ck_tlsr8656_ss5_01_7003_4',
                  'binary_sensor.sensor11',
                  'binary_sensor.sensor12',
                  'binary_sensor.sensor14',
                  'binary_sensor.sensor15',
                  'binary_sensor.sensor16'
                ];
                const open = ids.filter((id) => states[id]?.state === 'on').length;
                return open ? `${open} open · Attention` : '15 window contacts · View status';
              ]]]
            icon: mdi:window-closed-variant
            show_label: true
            tap_action:
              action: none
            styles: &summary_card_styles
              card:
                - min-height: 106px
                - padding: 14px
                - border-radius: var(--ha-card-border-radius)
                - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
                - background: var(--wnyhs-card-background, var(--ha-card-background))
                - box-shadow: var(--ha-card-box-shadow)
              icon:
                - width: 34px
                - color: var(--wnyhs-gold, var(--primary-color))
              name:
                - font-weight: 800
                - color: var(--primary-text-color)
              label:
                - white-space: normal
                - color: var(--secondary-text-color)
          - type: custom:button-card
            name: Entry Integration
            label: Doorbell and two locks pending onsite
            icon: mdi:doorbell-video
            show_label: true
            tap_action:
              action: none
            styles: *summary_card_styles

      - type: custom:button-card
        name: Appearance
        label: Light · Dark · Auto presentation ready for review
        icon: mdi:theme-light-dark
        show_label: true
        tap_action:
          action: none
        styles: *summary_card_styles

      - &footer
        type: markdown
        content: |
          ---
          **WNY Home Security** · wnyhomesecurity.com · 716-201-0364
        card_mod:
          style: |
            ha-card {
              text-align: center;
              color: var(--secondary-text-color);
              background: transparent;
              box-shadow: none;
            }

