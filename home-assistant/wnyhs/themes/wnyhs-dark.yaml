WNYHS Dark:
  # DESIGN001 REV02 canonical identity and customer-action roles.
  wnyhs-gold: "#D4AF37"
  action-blue: "#0A84FF"
  action-blue-hover: "#0876E4"
  action-blue-selected: "#075EBA"
  action-blue-disabled: "#64748B"

  # DESIGN001 REV02 canonical customer-status roles.
  status-normal: "#22C55E"
  status-active: "#0A84FF"
  status-attention: "#F5A524"
  status-alert: "#EF4444"
  status-unavailable: "#94A3B8"

  # DESIGN001 REV02 dark appearance roles.
  surface-page: "#08111F"
  surface-shell: "#0D1726"
  surface-tile: "#111D2E"
  surface-recessed: "#091321"
  text-primary: "#F8FAFC"
  text-muted: "#A8B3C2"
  border-divider: "#314056"
  focus-ring: "#5CB3FF"
  header-icon-background: "#050A12"
  card-radius: "16px"
  card-shadow: "0 10px 28px rgb(0 0 0 / 28%)"

  # Home Assistant platform mappings. Blue is executable action; gold is identity/accent.
  primary-color: "var(--action-blue)"
  accent-color: "var(--wnyhs-gold)"
  dark-primary-color: "var(--action-blue-selected)"
  light-primary-color: "var(--action-blue-hover)"
  primary-background-color: "var(--surface-page)"
  secondary-background-color: "var(--surface-recessed)"
  lovelace-background: "var(--surface-page)"
  markdown-code-background-color: "var(--surface-recessed)"

  primary-text-color: "var(--text-primary)"
  secondary-text-color: "var(--text-muted)"
  text-primary-color: "var(--text-primary)"
  disabled-text-color: "var(--status-unavailable)"
  divider-color: "var(--border-divider)"

  # Home Assistant compatibility aliases; canonical customer roles remain status-*.
  success-color: "var(--status-normal)"
  info-color: "var(--status-active)"
  warning-color: "var(--status-attention)"
  error-color: "var(--status-alert)"

  # Cards and surfaces.
  card-background-color: "var(--surface-tile)"
  ha-card-background: "var(--surface-tile)"
  ha-card-border-radius: "var(--card-radius)"
  ha-card-border-width: "1px"
  ha-card-border-color: "var(--border-divider)"
  ha-card-box-shadow: "var(--card-shadow)"
  border-radius: "var(--card-radius)"
  mdc-shape-medium: "var(--card-radius)"
  mdc-shape-small: "var(--card-radius)"

  # Header, sidebar, and navigation shell.
  app-header-background-color: "var(--surface-shell)"
  app-header-text-color: "var(--text-primary)"
  app-header-selection-bar-color: "var(--action-blue)"
  sidebar-background-color: "var(--surface-shell)"
  sidebar-text-color: "var(--text-muted)"
  sidebar-icon-color: "var(--text-muted)"
  sidebar-selected-background-color: "var(--surface-recessed)"
  sidebar-selected-text-color: "var(--action-blue-selected)"
  sidebar-selected-icon-color: "var(--action-blue)"

  # Icons and state mappings.
  paper-item-icon-color: "var(--wnyhs-gold)"
  paper-item-icon-active-color: "var(--status-active)"
  state-icon-color: "var(--wnyhs-gold)"
  state-icon-active-color: "var(--status-active)"
  state-icon-unavailable-color: "var(--status-unavailable)"
  state-lock-locked-color: "var(--status-normal)"
  state-lock-unlocked-color: "var(--status-attention)"
  state-binary-sensor-on-color: "var(--status-attention)"
  state-binary-sensor-off-color: "var(--status-normal)"
  state-cover-open-color: "var(--status-attention)"
  state-cover-closed-color: "var(--status-normal)"
  state-person-home-color: "var(--status-active)"
  state-person-not-home-color: "var(--status-unavailable)"

  # Forms and Material components.
  mdc-theme-primary: "var(--action-blue)"
  mdc-theme-secondary: "var(--wnyhs-gold)"
  mdc-theme-background: "var(--surface-page)"
  mdc-theme-surface: "var(--surface-tile)"
  mdc-theme-on-primary: "var(--text-primary)"
  mdc-theme-on-secondary: "var(--text-primary)"
  mdc-theme-on-surface: "var(--text-primary)"
  input-fill-color: "var(--surface-tile)"
  input-ink-color: "var(--text-primary)"
  input-label-ink-color: "var(--text-muted)"
  input-idle-line-color: "var(--border-divider)"
  input-hover-line-color: "var(--action-blue-hover)"

  # Existing reusable-component compatibility aliases.
  # Names are mechanics only and may not redefine DESIGN001 semantics.
  wnyhs-burgundy: "var(--action-blue)"
  wnyhs-card-background: "var(--surface-tile)"
  wnyhs-card-border: "var(--border-divider)"
  wnyhs-primary-button-background: "var(--action-blue)"
  wnyhs-primary-button-text: "var(--text-primary)"
  wnyhs-secondary-button-background: "var(--surface-recessed)"
  wnyhs-secondary-button-text: "var(--text-primary)"
  wnyhs-navigation-active: "var(--action-blue)"
  wnyhs-navigation-inactive: "var(--text-muted)"
  wnyhs-camera-live-badge: "var(--status-active)"
  wnyhs-lock-color: "var(--status-normal)"
  wnyhs-unlock-color: "var(--status-attention)"
  wnyhs-emergency-background: "var(--status-alert)"
  wnyhs-emergency-border: "var(--status-alert)"
  wnyhs-emergency-text: "var(--text-primary)"

  # Installed custom-card compatibility aliases.
  mushroom-card-primary-color: "var(--text-primary)"
  mushroom-card-secondary-color: "var(--text-muted)"
  mushroom-shape-color: "var(--surface-recessed)"
  mushroom-shape-icon-color: "var(--wnyhs-gold)"
  mushroom-state-info-color: "var(--status-active)"
  mushroom-state-success-color: "var(--status-normal)"
  mushroom-state-warning-color: "var(--status-attention)"
  mushroom-state-danger-color: "var(--status-alert)"
  button-card-border-radius: "var(--card-radius)"
  button-card-background-color: "var(--surface-tile)"
  button-card-primary-action-background: "var(--action-blue)"
  bubble-main-background-color: "var(--surface-tile)"
  bubble-accent-color: "var(--wnyhs-gold)"
  card-mod-theme: "WNYHS Dark"
  layout-card-margin: "10px"
  swipe-card-bullet-active-color: "var(--action-blue)"
  browser-mod-popup-border-radius: "var(--card-radius)"
  auto-entities-card-background: "var(--surface-tile)"
